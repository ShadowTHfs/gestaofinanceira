<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e7ff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- fundo (quadrado inteiro: o sistema arredonda os cantos) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#shine)"/>
  <g transform="translate(512 548) scale(1.1) translate(-512 -548)">
  <g filter="url(#soft)">
    <!-- cartão aparecendo atrás -->
    <rect x="292" y="268" width="420" height="170" rx="56" fill="#ffffff" fill-opacity="0.38"/>
    <!-- corpo da carteira -->
    <rect x="216" y="336" width="592" height="432" rx="112" fill="url(#body)"/>
    <!-- bolso / fecho -->
    <rect x="598" y="474" width="242" height="164" rx="82" fill="#4f46e5"/>
    <circle cx="676" cy="556" r="30" fill="#ffffff"/>
  </g>
  <!-- seta de crescimento -->
  <g fill="none" stroke="url(#arrow)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 664 L398 578 L466 622 L560 530"/>
    <path d="M498 526 L564 526 L564 592"/>
  </g>
  </g>
</svg>
